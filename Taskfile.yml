version: "3"

vars:
  USER: root
  HOST: 85.117.234.41
  PATH: /var/www/zveromir

tasks:
  backend:
    desc: Запуск бэкенда (dev)
    dir: backend
    cmds:
      - npm run dev

  frontend:
    desc: Запуск фронтенда (dev)
    dir: frontend
    cmds:
      - npm run dev

  dev:
    desc: Запустить всё для разработки
    deps: [backend, frontend]

  install:
    desc: Установить зависимости везде
    cmds:
      - cd backend && npm install
      - cd frontend && npm install

  deploy-frontend:
    desc: Прямой деплой фронтенда
    cmds:
      - cd frontend && npm run build
      - powershell -Command "Compress-Archive -Path ./frontend/.next, ./frontend/package.json, ./frontend/public, ./frontend/next.config.ts -DestinationPath frontend.zip -Force"
      - scp frontend.zip {{.USER}}@{{.HOST}}:{{.PATH}}/
      - |
        ssh {{.USER}}@{{.HOST}} "
          export NVM_DIR=\"\$HOME/.nvm\"
          [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\"
          mkdir -p {{.PATH}}/frontend && cd {{.PATH}}/frontend
          find . -maxdepth 1 ! -name '.env' ! -name 'node_modules' ! -name '.' -exec rm -rf {} +
          unzip -qo ../frontend.zip -d .
          rm ../frontend.zip
          npm install --production
          pm2 delete zveromir-front || true
          pm2 start npm --name 'zveromir-front' -- start -- -p 3000
          pm2 save
        "
      - powershell -Command "if (Test-Path frontend.zip) { Remove-Item frontend.zip }"

  deploy-backend:
    desc: Полный деплой бэкенда
    cmds:
      - powershell -Command "if (Test-Path deploy_temp) { Remove-Item -Recurse -Force deploy_temp }"
      - powershell -Command "if (Test-Path backend.zip) { Remove-Item backend.zip }"
      - powershell -Command "New-Item -ItemType Directory -Path deploy_temp"
      - powershell -Command "Copy-Item -Path ./backend/* -Destination deploy_temp -Recurse -Exclude 'node_modules','.git','*.log','backend.zip','zveromir.db','.env'"
      - powershell -Command "Compress-Archive -Path deploy_temp/* -DestinationPath backend.zip"
      - scp backend.zip {{.USER}}@{{.HOST}}:{{.PATH}}/
      - |
        ssh {{.USER}}@{{.HOST}} "
          export NVM_DIR=\"\$HOME/.nvm\"
          [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\"
          mkdir -p {{.PATH}}/backend && cd {{.PATH}}/backend
          find . -maxdepth 1 ! -name '.env' ! -name 'zveromir.db' ! -name 'node_modules' ! -name '.' -exec rm -rf {} +
          unzip -qo ../backend.zip -d .
          rm ../backend.zip
          node -e \"let pkg=require('./package.json'); pkg.type='module'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2))\"
          npm install
          printf \"module.exports = { apps: [{ name: 'zveromir-api', script: 'node', args: '--loader ts-node/esm --experimental-specifier-resolution=node src/index.ts' }] }\" > ecosystem.config.cjs
          pm2 delete zveromir-api || true
          pm2 start ecosystem.config.cjs
          pm2 save
        "
      - powershell -Command "Remove-Item -Recurse -Force deploy_temp"
      - powershell -Command "if (Test-Path backend.zip) { Remove-Item backend.zip }"

  deploy-all:
    desc: Полный деплой всего проекта
    cmds:
      - task: deploy-backend
      - task: deploy-frontend
